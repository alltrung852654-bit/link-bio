<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tấn Trung | Bio Link</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
        }

        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            /* ĐÃ XOÁ ÁNH SÁNG */
            /* box-shadow: 0 0 25px rgba(255,255,255,0.5); */
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 5px;
            font-size: 24px;
        }

        .bio {
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 25px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            background: rgba(255,255,255,0.15);
            padding: 14px;
            margin: 12px 0;
            border-radius: 12px;
            font-size: 15px;
            transition: 0.25s;
        }

        .link i {
            font-size: 18px;
        }

        .link:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px) scale(1.02);
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Avatar -->
    <img src="avt.jpg" alt="Tấn Trung" class="avatar">

    <h1>Tấn Trung</h1>
    <div class="bio">💻 Kỹ Thuật Máy Tính · 🔧 PC & Laptop</div>

    <!-- Links -->
    <a class="link" href="https://facebook.com/tinhdautuoi22" target="_blank">
        <i class="fab fa-facebook"></i> Facebook
    </a>

    <a class="link" href="https://m.me/tinhdautuoi22" target="_blank">
        <i class="fab fa-facebook-messenger"></i> Messenger
    </a>

    <a class="link" href="https://zalo.me/0393644871" target="_blank">
        <i class="fas fa-comment-dots"></i> Zalo
    </a>

    <footer>
        © 2026 Tấn Trung
    </footer>
</div>

</body>
</html>
