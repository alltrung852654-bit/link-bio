    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
        }

        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 5px;
            font-size: 24px;
        }

        .bio {
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 25px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            background: rgba(255,255,255,0.15);
            padding: 14px;
            margin: 12px 0;
            border-radius: 12px;
            font-size: 15px;
            transition: 0.25s;
        }

        .link i {
            font-size: 18px;
        }

        /* Zalo SVG icon – đồng bộ Font Awesome */
        .zalo-svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            color: #fff;
        }

        .link:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px) scale(1.02);
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="card">

    <img src="avt.jpg" alt="Tấn Trung" class="avatar">
